  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1a0a3e 0%, #1e1a5e 25%, #283593 50%, #1a237e 75%, #0d1442 100%);
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --teal-gradient: linear-gradient(135deg, #26a69a 0%, #00897b 100%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-gradient);
      background-attachment: fixed;
      z-index: -2;
    }

    .parallax-layer {
      position: absolute;
      top: -10%; left: 0; width: 100%; height: 120%;
      background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: -1;
      animation: parallaxAnim 20s ease-in-out infinite alternate;
    }

    @keyframes parallaxAnim {
      from { transform: translateY(0); }
      to { transform: translateY(-5%); }
    }

    .container {
      max-width: 540px;
      width: 90%;
      padding: 3rem 2rem;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .container img {
      max-width: 100%;
      height: auto;
      border-radius: 16px;
      margin-bottom: 2rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .countdown {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      color: #c5cae9;
    }

    #timer {
      font-weight: 700;
      color: #4db6ac;
      font-size: 1.4rem;
    }

    .destaque {
      display: inline-block;
      padding: 1rem 2rem;
      background: var(--teal-gradient);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      margin-bottom: 2rem;
    }

    .destaque:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 137, 123, 0.3);
    }

    .destaque:focus-visible {
      outline: 3px solid #80cbc4;
      outline-offset: 2px;
    }

    .credito {
      font-size: 0.85rem;
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    .credito:hover { opacity: 1; }

    .credito a {
      color: inherit;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="parallax-layer"></div>

  <main class="container">
    <img src="img/piscina.gif" alt="Piscina da N'ativa Academia" width="480" height="320" fetchpriority="high">

    <p class="countdown">
      Voce sera redirecionado ao Instagram em <span id="timer">8</span> segundos
    </p>

    <a href="nativa.html" class="destaque">
      Conheca a N'ativa Academia — Site Oficial
    </a>

    <p class="credito">
      Projeto digital por <a href="https://edusidegum.github.io/edusidegum/" rel="author">Edu Sidegum</a>
    </p>
  </main>

  <script>
    (function() {
      var count = 8;
      var timerDisplay = document.getElementById('timer');
      if (!timerDisplay) return;

      var countdownInterval = setInterval(function() {
        count--;
        timerDisplay.textContent = count;
        if (count <= 0) {
          clearInterval(countdownInterval);
          window.location.href = "https://www.instagram.com/nativaacademiadi/";
        }
      }, 1000);
    })();
  </script>
</body>
</html>
