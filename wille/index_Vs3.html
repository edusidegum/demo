  <style>
    :root {
      --gold: #c9a050;
      --gold-light: #e0c878;
      --copper: #b87333;
      --dark: #0d0d0d;
      --dark-warm: #1a0f0a;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      color: #ffffff;
      overflow: hidden;
      position: relative;
      background: var(--dark);
    }

    #bgVideo {
      position: fixed;
      top: 50%; left: 50%;
      min-width: 100%; min-height: 100%;
      width: auto; height: auto;
      z-index: -2;
      transform: translateX(-50%) translateY(-50%);
      filter: brightness(0.4);
      object-fit: cover;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, transparent 20%, var(--dark) 100%);
      z-index: -1;
    }

    .parallax-layer {
      position: absolute;
      top: -10%; left: 0; width: 100%; height: 120%;
      background-image: radial-gradient(circle, var(--gold) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.15;
      z-index: -1;
      animation: floatParticles 30s linear infinite;
    }

    @keyframes floatParticles {
      from { transform: translateY(0); }
      to { transform: translateY(-5%); }
    }

    .container {
      max-width: 560px;
      width: 90%;
      padding: 3.5rem 2rem;
      background: var(--glass);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
    }

    h1 {
      font-size: 2.5rem;
      color: var(--gold);
      margin-bottom: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    p { font-size: 1.1rem; color: #d1c4b2; margin-bottom: 2rem; line-height: 1.6; }

    .timer-box { margin-bottom: 2.5rem; font-size: 0.9rem; color: var(--gold-light); }
    #timer { font-weight: bold; font-size: 1.2rem; }

    .btn {
      display: block;
      padding: 1.2rem;
      margin-bottom: 1rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold) 0%, var(--copper) 100%);
      color: var(--dark);
    }

    .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(201, 160, 80, 0.3); }

    .btn-whatsapp {
      background: #25d366;
      color: white;
    }

    .btn-whatsapp:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3); }

    .credito {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      opacity: 0.5;
    }

    .credito a { color: inherit; text-decoration: underline; }

  <script>
    (function() {
      var count = 10;
      var timerDisplay = document.getElementById('timer');
      if (!timerDisplay) return;

      var countdown = setInterval(function() {
        count--;
        timerDisplay.textContent = count;
        if (count <= 0) {
          clearInterval(countdown);
          window.location.href = "wille.html";
        }
      }, 1000);
    })();
  </script>
